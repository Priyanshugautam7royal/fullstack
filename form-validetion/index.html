<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <form id="contact-form">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="contact-name" placeholder="Enter your full name">
            <span class="error" id="name-error"></span>
        </div>

        <div class="input-group">
            <label>Phone No.</label>
            <input type="tel" id="contact-phone" placeholder="1234567890">
            <span class="error" id="phone-error"></span>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="contact-email" placeholder="Enter your email">
            <span class="error" id="email-error"></span>
        </div>

        <div class="input-group">
            <label>Your Message</label>
            <textarea rows="5" id="contact-message" placeholder="Enter your message"></textarea>
            <span class="error" id="message-error"></span>
        </div>

        <button type="submit">Submit</button>
        <span id="submit-error" class="submit-error"></span>

    </form>
</div>

<script src="form.js"></script>
</body>
</html>
